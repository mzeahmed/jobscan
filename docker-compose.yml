services:
    traefik:
        image: traefik:v3.4
        container_name: jobscan_traefik
        command:
            - --configFile=/etc/traefik/traefik.yml
        # Ports décalés (443→8443, 8080→9080) pour coexister avec le Traefik
        # d'un autre projet Docker déjà sur les ports standards. Si 443/8080
        # sont libres, remettre "443:443"/"8080:8080" pour des URLs sans port
        # (voir README > Avec Docker).
        ports:
            - "8443:443"
            # Tableau de bord sans authentification (`insecure: true`) : réservé à cette machine.
            - "127.0.0.1:9080:8080"
        volumes:
            - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
            - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
            - ./certs:/certs
        networks:
            - frontend

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: dev
        container_name: jobscan_app
        working_dir: /app
        # Sous VOTRE identifiant (exporté par le makefile : HOST_UID/HOST_GID) : les fichiers créés dans ./app
        # (vendor, var, cache) vous appartiennent. Avant, ils appartenaient à root et exigeaient `chmod 777`.
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        volumes:
            - ./app:/app
        environment:
            HOME: /tmp
            COMPOSER_HOME: /tmp/composer
            # php-fpm ne reçoit les requêtes que de nginx (jamais d'Internet) : on lui fait confiance pour relayer
            # X-Forwarded-Proto/Host/Port de Traefik. Sans cela, les redirections de l'application sortent en http://.
            TRUSTED_PROXIES: REMOTE_ADDR
            APP_ENV: dev
            DATABASE_URL: "sqlite:///%kernel.project_dir%/var/jobscan.db"
            SEARXNG_URL: http://searxng:8080
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - searxng
        networks:
            - application

    nginx:
        image: nginx:alpine
        container_name: jobscan_nginx
        volumes:
            - ./app:/app
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - frontend
            - application

    searxng:
        image: searxng/searxng
        container_name: jobscan_searxng
        volumes:
            - ./docker/searxng/settings.yml:/etc/searxng/settings.yml
        environment:
            SEARXNG_BASE_URL: http://searxng.local
        networks:
            - frontend
            - application

networks:
    application:
    frontend:
