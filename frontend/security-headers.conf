# En-têtes de sécurité de l'écran React : SOURCE UNIQUE.
#
# - production : `.docker/nginx/prod.conf` l'inclut dans chaque `location` qui sert une page (les `add_header` d'un
#   bloc `location` remplacent ceux du serveur : on ne peut donc pas les poser une seule fois au niveau du serveur) ;
# - développement et tests : `vite.config.ts` relit la politique ci-dessous (en ajoutant seulement ce qui est propre
#   au développement) pour reproduire en local les blocages du navigateur vus en production.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
