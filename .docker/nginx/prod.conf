# Production : une seule porte d'entrée. L'écran React (fichiers statiques construits dans l'image) est servi tel quel ;
# `/api/` et `/health` sont relayés à php-fpm (Symfony). Le navigateur ne voit qu'une origine : ni CORS, ni cookie
# inter-site. nginx est publié sur 127.0.0.1 : exposez-le par votre proxy HTTPS (voir docs/DEPLOY.md).
server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Résolveur DNS Docker : évite un échec fatal au démarrage si "app" n'est pas encore résolvable
    # (depends_on garantit l'ordre de démarrage, pas la disponibilité DNS immédiate).
    resolver 127.0.0.11 valid=10s;

    # API et sondes : Symfony. Le script est celui du conteneur php-fpm (aucun fichier PHP n'existe dans cette image) ;
    # l'adresse demandée (REQUEST_URI) est conservée telle quelle pour le routeur. Les en-têtes de sécurité de ces
    # réponses sont posés par Symfony.
    location ~ ^/(api/|health) {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    # Écran React : toute adresse inconnue retombe sur index.html (routeur côté navigateur).
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/jobscan/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/jobscan/security-headers.conf;
    }

    # Fichiers à empreinte (Vite) : cache d'un an, jamais revalidés.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_log /var/log/nginx/jobscan_error.log;
    access_log /var/log/nginx/jobscan_access.log;
}
