server {
    listen 80;

    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    root /app/public;
    index index.php;

    # Résolveur DNS Docker : évite un échec fatal au démarrage si "app" n'est
    # pas encore résolvable (depends_on garantit l'ordre de démarrage, pas la
    # disponibilité DNS immédiate).
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/jobscan_error.log;
    access_log /var/log/nginx/jobscan_access.log;
}

# Front React (développement) : `app.jobscan.local`. Même origine pour le navigateur : `/api` et `/health` vont à
# Symfony, tout le reste au serveur Vite (avec WebSocket pour le rechargement à chaud). Les noms sont résolus à
# l'exécution (variables + resolver) : nginx démarre même si le front n'est pas lancé.
server {
    listen 80;
    server_name app.jobscan.local;
    server_tokens off;

    root /app/public;
    resolver 127.0.0.11 valid=10s;

    location ~ ^/(api/|health) {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        include fastcgi_params;

        # Contrôleur frontal : l'adresse demandée (REQUEST_URI) est conservée telle quelle pour le routeur Symfony.
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location / {
        set $frontend http://frontend:5173;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Le rechargement à chaud de Vite passe par une connexion WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
