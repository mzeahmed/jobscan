# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# API versionnée : tout ce qui se trouve sous src/Api/ (sauf les sondes) est servi sous /api/v1.
api_v1:
    resource:
        path: ../src/Api/
        namespace: App\Api
    type: attribute
    exclude:
        - ../src/Api/Probe/
    prefix: /api/v1

# Sondes d'infrastructure : hors préfixe et hors enveloppe (lues par Docker ou un répartiteur de charge).
probes:
    resource:
        path: ../src/Api/Probe/
        namespace: App\Api\Probe
    type: attribute
