# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.ats.lever_default_region: global
    app.email.default_port: 993
    app.email.default_encryption: ssl
    app.email.default_authentication: plain
    app.email.default_folder: INBOX
    app.email.default_validate_certificate: true
    app.france_travail.scope: !php/const App\Provider\FranceTravailProvider::DEFAULT_SCOPE
    app.france_travail.token_url: !php/const App\Provider\FranceTravailProvider::DEFAULT_TOKEN_URL
    app.france_travail.api_url: !php/const App\Provider\FranceTravailProvider::DEFAULT_API_URL
    telegram.bot_token: '%env(TELEGRAM_BOT_TOKEN)%'
    telegram.chat_id: '%env(TELEGRAM_CHAT_ID)%'
    app.job_feed_urls:
        - '%env(default::JOB_FEED_URL_1)%'
        - '%env(default::JOB_FEED_URL_2)%'
#        - '%env(default::JOB_FEED_URL_3)%'
#        - '%env(default::JOB_FEED_URL_4)%'
#        - '%env(default::JOB_FEED_URL_5)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Provider\JobProviderInterface:
            tags: ['app.job_provider']
        App\Email\Parser\EmailParserInterface:
            tags: ['app.email_parser']

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/JobscanBundle.php'

    App\Command\RunPipelineCommand:
        arguments:
            $providers: !tagged_iterator app.job_provider
            $environment: '%kernel.environment%'
            $analysisLimit: '%app.profile.analysis_batch_limit%'

    App\Command\ValidateProfileCommand:
        arguments:
            $examplesDirectory: '%kernel.project_dir%/config/profile'

    App\Command\InitProfileCommand:
        arguments:
            $examplesDirectory: '%kernel.project_dir%/config/profile'

    App\Command\AnalyzeJobsCommand:
        arguments:
            $defaultLimit: '%app.profile.analysis_batch_limit%'

    App\Notification\TelegramNotifier:
        arguments:
            $botToken: '%telegram.bot_token%'
            $chatId: '%telegram.chat_id%'
            $maxAttempts: '%app.profile.telegram_max_attempts%'
            $initialRetryDelayMs: '%app.profile.telegram_initial_retry_delay_ms%'

    App\Notification\Notifier:
        arguments:
            $scoreThreshold: '%app.profile.notification_threshold%'

    llm.retry_strategy:
        class: Symfony\Component\HttpClient\Retry\GenericRetryStrategy
        arguments:
            $statusCodes: [0, 429, 500, 502, 503, 504]
            $delayMs: '%app.profile.ai_initial_retry_delay_ms%'
            $multiplier: '%app.profile.ai_retry_multiplier%'
            $jitter: 0.0

    llm.retryable_http_client:
        class: Symfony\Component\HttpClient\RetryableHttpClient
        arguments:
            $client: '@http_client'
            $strategy: '@llm.retry_strategy'
            $maxRetries: '%app.profile.ai_max_retries%'
            $logger: '@logger'

    App\AI\Provider\OllamaClient:
        arguments:
            $httpClient: '@llm.retryable_http_client'
            $apiBase: '%jobscan.llm.ollama.base_url%'
            $model: '%jobscan.llm.ollama.model%'

    App\AI\Provider\LMStudioClient:
        arguments:
            $httpClient: '@llm.retryable_http_client'
            $apiBase: '%jobscan.llm.lmstudio.base_url%'
            $model: '%jobscan.llm.lmstudio.model%'

    App\AI\Provider\GeminiClient:
        arguments:
            $httpClient: '@llm.retryable_http_client'
            $apiKey: '%jobscan.llm.gemini.api_key%'
            $model: '%jobscan.llm.gemini.model%'

    App\AI\Provider\LLMClientFactory:
        arguments:
            $providerName: '%jobscan.llm.provider%'

    llm.client:
        class: App\AI\Provider\LLMClientInterface
        factory: ['@App\AI\Provider\LLMClientFactory', 'create']

    App\AI\AIClient:
        arguments:
            $provider: '@llm.client'
            $cache: '@cache.app'
            $systemPrompt: '%app.ai_system_prompt%'
            $knownStack: '%app.profile.known_stack%'
            $recentJobDays: '%app.profile.recent_job_days%'

    App\Provider\RsFeedProvider:
        arguments:
            $feedUrls: '%app.job_feed_urls%'
        tags: ['app.job_provider']

    App\Provider\RemoteOkProvider:
        arguments:
            $apiUrl: '%env(REMOTEOK_API_URL)%'
        tags: ['app.job_provider']

    App\Provider\FranceTravailProvider:
        arguments:
            $cache: '@cache.app'
            $enabled: '%env(bool:default::FRANCE_TRAVAIL_ENABLED)%'
            $clientId: '%env(default::FRANCE_TRAVAIL_CLIENT_ID)%'
            $clientSecret: '%env(default::FRANCE_TRAVAIL_CLIENT_SECRET)%'
            $scope: '%env(default:app.france_travail.scope:FRANCE_TRAVAIL_SCOPE)%'
            $tokenUrl: '%env(default:app.france_travail.token_url:FRANCE_TRAVAIL_TOKEN_URL)%'
            $apiUrl: '%env(default:app.france_travail.api_url:FRANCE_TRAVAIL_API_URL)%'
            $keywords: '%env(csv:default:app.profile.empty_csv:FRANCE_TRAVAIL_KEYWORDS)%'
            $departments: '%env(csv:default:app.profile.empty_csv:FRANCE_TRAVAIL_DEPARTMENTS)%'
            $maxPages: '%app.profile.france_travail_max_pages%'
            $pageSize: '%app.profile.france_travail_page_size%'
            $lookbackDays: '%app.profile.france_travail_lookback_days%'
            $minRequestIntervalMs: '%app.profile.france_travail_min_request_interval_ms%'
        tags: ['app.job_provider']

    App\Email\ImapEmailClient:
        arguments:
            $host: '%env(string:default::EMAIL_IMAP_HOST)%'
            $port: '%env(int:default:app.email.default_port:EMAIL_IMAP_PORT)%'
            $encryption: '%env(default:app.email.default_encryption:EMAIL_IMAP_ENCRYPTION)%'
            $username: '%env(string:default::EMAIL_IMAP_USERNAME)%'
            $password: '%env(string:default::EMAIL_IMAP_PASSWORD)%'
            $authentication: '%env(default:app.email.default_authentication:EMAIL_IMAP_AUTH)%'
            $folder: '%env(default:app.email.default_folder:EMAIL_IMAP_FOLDER)%'
            $validateCertificate: '%env(bool:default:app.email.default_validate_certificate:EMAIL_IMAP_VALIDATE_CERT)%'

    App\Email\EmailClientInterface: '@App\Email\ImapEmailClient'

    App\Email\Parser\GenericEmailParser:
        arguments:
            $senderDomains: '%env(csv:default:app.profile.empty_csv:EMAIL_GENERIC_SENDER_DOMAINS)%'
            $linkDomains: '%env(csv:default:app.profile.empty_csv:EMAIL_GENERIC_LINK_DOMAINS)%'

    App\Email\EmailJobProvider:
        arguments:
            $parsers: !tagged_iterator app.email_parser
            $enabled: '%env(bool:default::EMAIL_ENABLED)%'
            $lookbackDays: '%app.profile.email_lookback_days%'
            $maxMessages: '%app.profile.email_max_messages%'
        tags: ['app.job_provider']

    App\Provider\Ats\GreenhouseProvider:
        arguments:
            $boards: '%env(csv:default:app.profile.empty_csv:GREENHOUSE_BOARDS)%'
            $minRequestIntervalMs: '%app.profile.ats_min_request_interval_ms%'
        tags: ['app.job_provider']

    App\Provider\Ats\LeverProvider:
        arguments:
            $boards: '%env(csv:default:app.profile.empty_csv:LEVER_BOARDS)%'
            $minRequestIntervalMs: '%app.profile.ats_min_request_interval_ms%'
            $region: '%env(default:app.ats.lever_default_region:LEVER_REGION)%'
            $pageSize: '%app.profile.lever_page_size%'
            $maxPages: '%app.profile.lever_max_pages%'
        tags: ['app.job_provider']

    App\Provider\Ats\AshbyProvider:
        arguments:
            $boards: '%env(csv:default:app.profile.empty_csv:ASHBY_BOARDS)%'
            $minRequestIntervalMs: '%app.profile.ats_min_request_interval_ms%'
        tags: ['app.job_provider']

    App\Provider\SearxNoiseFilter:
        arguments:
            $blockedPatterns: '%app.profile.searx_blocked_patterns%'
            $jobSignals: '%app.profile.searx_job_signals%'

    App\Provider\SearxProvider:
        arguments:
            $baseUrl: '%env(SEARXNG_URL)%'
            $cache: '@cache.app'
            $searchQueries: '%app.profile.searx_queries%'
            $locations: '%app.profile.job_locations%'
            $maxQueries: '%app.profile.searx_max_queries%'
            $concurrency: '%app.profile.searx_concurrency%'
            $cacheTtl: '%app.profile.searx_cache_ttl%'
            $maxPages: '%app.profile.searx_max_pages%'
            $queryDelayMs: '%app.profile.searx_query_delay_ms%'
            $noiseFilter: '@App\Provider\SearxNoiseFilter'
        tags: [ 'app.job_provider' ]

    App\Profile\ProfileLoader:
        arguments:
            $directory: '%app.profile.directory%'
            $defaultWeights: '%app.profile.match_weights%'
            $defaultMinMatchScore: '%app.profile.default_min_match_score%'

    App\Provider\CollectionPolicy:
        arguments:
            $blockedDomains: '%app.profile.collection_blocked_domains%'

    App\Analysis\AnalysisRetryPolicy:
        arguments:
            $maxAttempts: '%app.profile.analysis_max_attempts%'
            $initialDelayMinutes: '%app.profile.analysis_initial_delay_minutes%'
            $multiplier: '%app.profile.analysis_retry_multiplier%'
            $maxDelayMinutes: '%app.profile.analysis_max_delay_minutes%'

    App\Scoring\FreshnessScorer:
        arguments:
            $bands: '%app.profile.freshness_bands%'
            $olderScore: '%app.profile.freshness_older_score%'
            $unknownScore: '%app.profile.freshness_unknown_score%'
            $lowConfidenceCap: '%app.profile.freshness_low_confidence_cap%'

    App\Processor\JobProcessor:
        arguments:
            $filterKeywords: '%app.profile.filter_keywords%'
            $excludedPlatformDomains: '%app.profile.excluded_platform_domains%'
            $maxJobAgeDays: '%app.profile.max_job_age_days%'
            $aiPrescoreThreshold: '%app.profile.ai_prescore_threshold%'
            $batchSize: '%app.profile.persistence_batch_size%'

    App\Scoring\Scoring:
        arguments:
            $scoringConfig: '%app.profile.scoring%'
