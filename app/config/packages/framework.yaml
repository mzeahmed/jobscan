# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Derrière un proxy inverse (Traefik) : adresses des proxys de confiance (TRUSTED_PROXIES : adresses ou réseaux exacts ; éviter `private_ranges`, CVE-2026-121619). Vide
    # par défaut : aucun en-tête X-Forwarded-* n'est cru, donc personne ne peut falsifier son adresse ou le schéma HTTPS.
    trusted_proxies: '%env(default:app.trusted_proxies_default:TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    # Connexion à l'API : limitation du débit par adresse puis par couple adresse/identifiant (force brute).
    rate_limiter:
        api_login_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        api_login_user:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        # Stockage en mémoire, propre à chaque démarrage du noyau de test.
        rate_limiter:
            api_login_ip:
                storage_service: limiter.test_storage
            api_login_user:
                storage_service: limiter.test_storage
