jobscan:
    llm:
        provider: '%env(DEFAULT_LLM_PROVIDER)%' # ollama | lmstudio | gemini

        ollama:
            base_url: '%env(OLLAMA_BASE_URL)%'
            model: '%env(OLLAMA_MODEL)%'

        lmstudio:
            base_url: '%env(LMSTUDIO_BASE_URL)%'
            model: '%env(LMSTUDIO_MODEL)%'

        gemini:
            api_key: '%env(GEMINI_API_KEY)%'
            model: '%env(GEMINI_MODEL)%'

parameters:
    # Profil métier centralisé : recherche, filtrage, scoring et seuils.
    app.profile.filter_keywords: '%env(csv:FILTER_KEYWORDS)%'
    app.profile.known_stack: '%env(csv:KNOWN_STACK)%'
    app.profile.searx_queries: '%env(csv:SEARX_QUERIES)%'
    app.profile.job_locations: '%env(csv:JOB_LOCATIONS)%'
    app.profile.empty_csv: ''
    # Profil candidat et profils de recherche : fichiers YAML locaux (données personnelles, gitignorés).
    # Dossier surchargeable par JOBSCAN_PROFILE_DIR (volume Docker, par exemple).
    app.profile.default_directory: '%kernel.project_dir%/config/profile/local'
    app.profile.directory: '%env(default:app.profile.default_directory:JOBSCAN_PROFILE_DIR)%'
    # Seuil minimal de compatibilité d'un profil de recherche qui n'en définit pas.
    app.profile.default_min_match_score: 50
    # Poids relatifs par défaut des critères du score de compatibilité (surchargeables par profil).
    app.profile.match_weights:
        required_skills: 40
        nice_skills: 15
        title: 15
        location: 10
        remote: 5
        contract: 5
        salary: 5
        seniority: 3
        languages: 1
        availability: 1
    # Exclusion métier : offres écartées quelle que soit leur provenance (email compris).
    app.profile.excluded_platform_domains: '%env(csv:default:app.profile.empty_csv:EXCLUDED_PLATFORM_DOMAINS)%'
    # Restriction de collecte : domaines que SearXNG et les flux RSS ne doivent pas récupérer
    # (plateformes interdisant l'extraction automatisée), sans exclure leurs emails d'alerte.
    app.profile.collection_blocked_domains: '%env(csv:default:app.profile.empty_csv:COLLECTION_BLOCKED_DOMAINS)%'
    app.profile.max_job_age_days: 30
    app.profile.recent_job_days: 14
    app.profile.ai_prescore_threshold: 10
    # Deux retries après l'appel initial, soit trois appels LLM au maximum.
    app.profile.ai_max_retries: 2
    app.profile.ai_initial_retry_delay_ms: 1000
    app.profile.ai_retry_multiplier: 2.0
    # Longueur maximale (caractères) de l'annonce envoyée au LLM : les exigences figurent souvent en fin de texte.
    app.profile.ai_max_input_chars: 6000
    app.profile.persistence_batch_size: 20
    # Reprise des analyses : tentatives max, délai initial puis exponentiel (plafonné),
    # et nombre d'offres analysées à la fin de chaque run du pipeline.
    app.profile.analysis_max_attempts: 5
    app.profile.analysis_initial_delay_minutes: 15
    app.profile.analysis_retry_multiplier: 2.0
    app.profile.analysis_max_delay_minutes: 1440
    app.profile.analysis_batch_limit: 50
    app.profile.notification_threshold: 60
    app.profile.telegram_max_attempts: 3
    app.profile.telegram_initial_retry_delay_ms: 250
    # France Travail (provider désactivé par défaut, voir FRANCE_TRAVAIL_ENABLED).
    app.profile.france_travail_max_pages: 3
    app.profile.france_travail_page_size: 150
    # Fenêtre de la première collecte, puis collecte incrémentale depuis le dernier succès.
    app.profile.france_travail_lookback_days: 7
    # 150 ms entre deux requêtes ≈ 6 appels/s, sous le quota annoncé de 10 appels/s.
    app.profile.france_travail_min_request_interval_ms: 150
    # ATS (Greenhouse, Lever, Ashby) : API publiques, un provider est actif dès qu'un board est configuré.
    # Pause minimale entre deux requêtes ; aucun quota n'est documenté pour ces API.
    app.profile.ats_min_request_interval_ms: 200
    # Lever : pagination skip/limit sans maximum documenté ; la collecte s'arrête sur une page vide.
    app.profile.lever_page_size: 100
    app.profile.lever_max_pages: 10
    # Alertes email (provider désactivé par défaut, voir EMAIL_ENABLED).
    # Fenêtre IMAP relue à chaque run : les emails déjà traités sont ignorés grâce à `processed_email`.
    app.profile.email_lookback_days: 7
    # Emails téléchargés par exécution (les plus anciens d'abord).
    app.profile.email_max_messages: 50
    app.profile.searx_max_queries: 20
    app.profile.searx_concurrency: 5
    app.profile.searx_cache_ttl: 3600
    # Nombre maximal de pages récupérées pour chaque requête SearXNG.
    app.profile.searx_max_pages: 2
    # Pause entre deux lots concurrents ; 0 désactive la temporisation.
    app.profile.searx_query_delay_ms: 500

    # Filtre de bruit sur les résultats de recherche web (SearxNoiseFilter).
    # Un résultat est écarté s'il contient un pattern bloquant, OU s'il ne contient
    # aucun signal emploi.
    app.profile.searx_blocked_patterns:
        - tutorial
        - cours
        - formation
        - manual
        - documentation
        - wikipedia
        - youtube.com
        - openclassrooms.com
        - w3schools.com
        - geeksforgeeks.org
        - php.net
        - github.com/php
    app.profile.searx_job_signals:
        - job
        - jobs
        - emploi
        - emplois
        - recrute
        - recrutement
        - hiring
        - remote
        - freelance
        - mission
        - cdi
        - cdd
        - developer
        - développeur
        - developpeur
        - engineer
        - ingénieur
        - ingenieur
        - poste
        - opportunité
        - opportunite
        - contractor
        - contract
        - lead
        - architect
        - architecte
        - backend
        - back-end
        - full stack
        - fullstack
        - full-stack

    # --- Matching (compatibilité, priorité) ---------------------------------------------------------
    # Priorité = compatibilité et fraîcheur pondérées (poids relatifs). Une offre éliminée vaut 0, et une offre
    # non compatible ne dépasse jamais son score de compatibilité : la fraîcheur seule ne rend pas prioritaire.
    app.profile.priority_match_weight: 75
    app.profile.priority_freshness_weight: 25
    # Couverture minimale (0-100) de l'information pour conclure : en dessous, le verdict est « données insuffisantes ».
    # La couverture est la part du poids des critères applicables qui a pu être évaluée.
    app.profile.match_min_coverage: 40
    # Années d'expérience attendues par niveau de séniorité, quand l'annonce ne donne pas de nombre d'années.
    app.profile.seniority_years:
        junior: 0
        mid: 2
        senior: 5
    # Noms de compétences équivalents ; le premier de chaque groupe est la forme canonique. La casse, les
    # accents, la ponctuation et les numéros de version sont déjà ignorés (« PHP 8 » = « PHP »).
    app.profile.skill_aliases:
        - [javascript, js, ecmascript]
        - [typescript, ts]
        - [nodejs, node, 'node.js']
        - [react, reactjs, 'react.js']
        - [vue, vuejs, 'vue.js']
        - [postgresql, postgres, pgsql]
        - [kubernetes, k8s]
        - [golang, go]
        - [csharp, 'c#']
        - ['gitlab ci/cd', 'gitlab ci', 'gitlab-ci']
        - ['ci/cd', cicd]
        - [aws, 'amazon web services']
        - [gcp, 'google cloud platform', 'google cloud']
        - [elasticsearch, 'elastic search']
        - ['rest api', restful, 'api rest', rest]
        - [wordpress, wp]

    # Barème de fraîcheur (hypothèse métier, pas une vérité statistique).
    # `max_hours` : borne supérieure exclue de la tranche, par âge croissant.
    app.profile.freshness_bands:
        - { max_hours: 6, score: 100 }
        - { max_hours: 24, score: 90 }
        - { max_hours: 48, score: 75 }
        - { max_hours: 96, score: 60 }
        - { max_hours: 168, score: 40 }
        - { max_hours: 336, score: 20 }
    app.profile.freshness_older_score: 5
    # Date inconnue ou invraisemblable : jamais le score maximal.
    app.profile.freshness_unknown_score: 25
    # Plafond d'une date de confiance faible (extraite d'un texte libre, par exemple).
    app.profile.freshness_low_confidence_cap: 50

    app.profile.scoring:
        prescore:
            keywords:
                php: 10
                symfony: 15
                wordpress: 10
                backend: 7
                fullstack: 7
                api: 5
            remote_keywords:
                - remote
                - télétravail
                - teletravail
            remote_bonus: 5
            negative_keywords:
                stage: -50
                alternance: -50
        compute:
            title_keywords:
                php: 20
            stack_keywords:
                symfony: 30
                wordpress: 20
            contract_bonuses:
                freelance: 15
                cdi: 10
            flag_bonuses:
                remote: 10
                recent: 20
            description_keywords:
                mission: 10
                urgent: 15
                asap: 15
            negative_keywords:
                stage: -50
                alternance: -50
            seniority_bonuses:
                senior: 15
                mid: 5
                junior: -10
            budget_bonus:
                min_daily_rate: 500
                min_annual_salary: 55
                points: 10

    app.ai_system_prompt: |
        Tu es un extracteur d'informations d'offres d'emploi.

        Tu dois répondre STRICTEMENT avec un objet JSON valide.
        Aucun texte avant. Aucun texte après. Aucun markdown. Aucun bloc ```json.

        Schéma EXACT (toutes les clés) :

        {
          "required_skills": ["PHP", "Symfony"],
          "nice_skills": ["Docker"],
          "mentioned_skills": ["Redis"],
          "seniority": "junior|mid|senior|unknown",
          "min_years_experience": 3,
          "languages": [{"name": "anglais", "level": "courant", "required": true}],
          "remote_mode": "onsite|hybrid|remote|null",
          "contract_types": ["freelance", "cdi", "cdd", "alternance", "stage"],
          "salary": {"min": 45000, "max": 55000, "currency": "EUR", "period": "annual|daily"},
          "locations": ["Marseille"]
        }

        Règles strictes :

        - N'INVENTE RIEN. Tout ce que tu écris doit figurer dans l'annonce.
          Information absente : [] pour une liste, null pour une valeur, "unknown" pour seniority.
        - "required_skills" : technologies, outils ou compétences explicitement EXIGÉS
          (« requis », « obligatoire », « indispensable », « maîtrise de », « must have »).
        - "nice_skills" : explicitement APPRÉCIÉS (« un plus », « souhaité », « apprécié », « bonus », « nice to have »).
        - "mentioned_skills" : autres technologies citées sans indication d'exigence (simple liste de stack).
        - Une compétence ne figure que dans UNE liste, la plus exigeante. Noms courts, comme écrits dans l'annonce.
        - "seniority" : senior si 3 ans d'expérience ou plus, ou si « senior », « confirmé » ou autonomie sont demandés ;
          junior si débutant ; mid pour l'intermédiaire ; sinon unknown.
        - "min_years_experience" : entier, uniquement si l'annonce donne un nombre d'années ; sinon null.
        - "remote_mode" : "remote" (télétravail complet), "hybrid" (télétravail partiel), "onsite" (sur site) ; sinon null.
        - "contract_types" : uniquement ceux explicitement mentionnés. Freelance, mission ou TJM = "freelance".
        - "salary" : uniquement si un montant figure dans l'annonce. "daily" pour un TJM, "annual" pour un salaire annuel.
          Montants en entiers, dans la devise de l'annonce, SANS aucune conversion de devise. Sinon null.
        - "languages" : langues citées ; "required" vaut true si elle est exigée, false si elle est appréciée.
        - "locations" : lieux de travail cités (villes, régions, pays) ; [] si aucun.

        Réponds UNIQUEMENT avec le JSON.
