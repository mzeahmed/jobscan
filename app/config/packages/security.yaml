# Compte unique local, identifiants dans l'environnement (jamais dans le dépôt) : celui de la connexion à l'API.
# Tout est refusé tant qu'aucun mot de passe n'est configuré (JOBSCAN_UI_PASSWORD_HASH, voir docs/API.md).
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        ui_user:
            id: App\Security\UiUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        # API : sans session ni cookie, authentifiée par le jeton d'accès (Authorization: Bearer).
        api:
            pattern: ^/api(/|$)
            stateless: true
            provider: ui_user
            custom_authenticators:
                - App\Api\Identity\Security\JwtAuthenticator
        # Tout le reste est refusé : l'application n'expose que l'API et les sondes (publiques, voir access_control).
        main:
            lazy: true
            provider: ui_user

    access_control:
        # Sondes d'infrastructure et racine de l'API : publiques, sans donnée sur l'installation.
        - { path: ^/health(/ready)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/?$, roles: PUBLIC_ACCESS }
        # Ouverture, renouvellement et fermeture de session : ils portent leurs propres justificatifs (mot de passe, cookie).
        - { path: ^/api/v1/auth/(login|refresh|logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: 'auto'
                cost: 4
                time_cost: 3
                memory_cost: 10
